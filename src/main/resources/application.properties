spring.application.name=blogger

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ylca_blog?createDatabaseIfNotExist=true
spring.datasource.username=ylca_user
spring.datasource.password=ylca_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.app.authKey=__SecretKey__

spring.app.jwtSecret=VlBad2l3VnBLeHZ0ZEtsOFh2ckh0S1NqdGRGS2hkc1I=
spring.app.jwtExpirationMs=30000000

spring.app.jwtCookieName=blogger-cookie

frontend.url=http://localhost:5173
image.base.url=http://localhost:8080/images

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1KB

# Image storage directory
app.upload.dir=uploads/images/

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://ylca-admin.vercel.app,https://ylca-cybersecurity.vercel.app
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600