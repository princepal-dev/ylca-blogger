spring.application.name=blogger

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ylca_blog?createDatabaseIfNotExist=true
spring.datasource.username=ylca_user
spring.datasource.password=ylca_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.app.authKey=__SecretKey__

spring.app.jwtSecret=VlBad2l3VnBLeHZ0ZEtsOFh2ckh0S1NqdGRGS2hkc1I=
spring.app.jwtExpirationMs=30000000

spring.app.jwtCookieName=blogger-cookie

# API Configuration
api.base.url=https://api.ylca.tech
frontend.url=https://admin.ylca.tech

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1KB

# File upload directory (PDFs and author images)
app.upload.dir=./src/main/resources/uploads/

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://admin.ylca.tech,https://www.admin.ylca.tech,https://www.ylca.tech,https://ylca.tech
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# User generation settings
user.generation.username.length=8
user.generation.password.length=12

# Validation limits
validation.title.min=10
validation.title.max=200
validation.fullname.min=2
validation.fullname.max=100
validation.phone.max=10