spring.application.name=blogger

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blogger_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.app.authKey=__SecretKey__

spring.app.jwtSecret=VPZwiwVpKxvtdKl8XvrHtKSjtdFKhdsR
spring.app.jwtExpirationMs=30000000

spring.app.jwtCookieName=blogger-cookie

frontend.url=http://localhost:5173
image.base.url=http://localhost:8080/images

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1KB

# Image storage directory
app.upload.dir=uploads/images/